name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `prisma generate` first. Neither the client
      # generation nor the Next.js build touches the database, so no secrets
      # are needed here.
      - name: Typecheck
        run: npx prisma generate && npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Build
        run: npm run build
