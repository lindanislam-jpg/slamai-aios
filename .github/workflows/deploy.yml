name: Deploy

# Deploys main to Vercel after CI passes. The job no-ops until the three Vercel
# secrets are set on the repository, so it is safe to merge before then.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check for Vercel credentials
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets are not set — skipping deploy. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # Vercel builds from the project settings pulled here, so environment
      # variables live in the Vercel dashboard rather than in this workflow.
      - name: Pull Vercel environment
        if: steps.check.outputs.ready == 'true'
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to $url"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url/life" >> "$GITHUB_STEP_SUMMARY"
