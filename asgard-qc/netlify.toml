# Netlify build for the ASGARD Quality Command Centre (see docs/DEPLOYMENT.md).
# Secrets (ADMIN_PASSWORD etc.) are set in the Netlify UI/CLI, never here.
[build]
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
